name: Laravel CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    name: Validate Laravel application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, bcmath, gd, fileinfo, openssl, ctype, tokenizer, xml, curl
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Preserve reproducible Composer lockfile
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 7
      - name: Audit Composer dependencies
        run: composer audit --no-interaction
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Test fresh migrations and seeders
        run: "DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan migrate:fresh --seed"
      - name: Lint PHP source
        run: "find app routes database -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Check JavaScript syntax
        run: node --input-type=module --check < public/assets/js/store.js
      - name: Compile all Blade views
        run: php artisan view:cache
      - name: Run feature tests
        run: php artisan test

  lockfile:
    name: Generate and commit Composer lockfile
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, bcmath, gd, fileinfo, openssl, ctype, tokenizer, xml, curl
          coverage: none
      - name: Generate lockfile only when absent
        run: |
          if [ ! -f composer.lock ]; then
            composer update --no-interaction --prefer-dist --no-install --no-scripts
            composer validate --no-check-publish
            git add composer.lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add reproducible Composer lockfile"
            git push origin HEAD:main
          fi
