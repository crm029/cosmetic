name: Laravel CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, bcmath, gd, fileinfo, openssl, ctype, tokenizer, xml, curl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan migrate:fresh --seed
      - run: find app routes database -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan view:cache
      - run: php artisan test
